<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #fff5fb;
        color: #4a2140;
      }
      .card {
        max-width: 420px;
        margin: 1rem;
        text-align: center;
        background: #fff;
        border: 1px solid #ffd5ec;
        border-radius: 20px;
        padding: 1.25rem;
        box-shadow: 0 12px 28px rgba(255, 61, 162, 0.12);
      }
      a {
        color: #e30085;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Taking you back…</h1>
      <p>This page doesn’t exist. Redirecting to the quiz now.</p>
      <p><a id="home-link" href="./">Go to quiz</a></p>
    </main>

    <script>
      (function redirectToRoot() {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const basePath = parts.length > 0 ? `/${parts[0]}/` : "/";
        document.getElementById("home-link").setAttribute("href", basePath);
        setTimeout(() => window.location.replace(basePath), 250);
      })();
    </script>
  </body>
</html>
